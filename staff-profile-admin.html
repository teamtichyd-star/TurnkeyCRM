<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Staff Directory</title>
<link rel="stylesheet" href="newstyle.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<style>
.admin-wrap{padding:20px;max-width:1100px;margin:0 auto 80px}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.page-header h2{margin:0;font-size:20px}
.page-header p{margin:4px 0 0;color:var(--text-muted);font-size:13px}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.stat-card .icon{font-size:20px;color:var(--primary);background:rgba(99,102,241,0.1);padding:10px;border-radius:8px;width:40px;height:40px;display:flex;align-items:center;justify-content:center}
.stat-card .info h4{margin:0;font-size:11px;color:var(--text-muted);text-transform:uppercase}
.stat-card .info p{margin:2px 0 0;font-size:22px;font-weight:700;color:var(--text)}
.search-bar{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap}
.search-bar input{background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-size:13px;flex:1;min-width:180px}
.search-bar select{background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-size:13px}
.staff-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.staff-card{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:0.2s}
.staff-card:hover{border-color:var(--primary);transform:translateY(-2px)}
.staff-card-top{padding:16px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--border)}
.staff-avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--border);flex-shrink:0}
.staff-avatar-placeholder{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;font-weight:700;flex-shrink:0}
.staff-name{font-size:15px;font-weight:700;color:var(--text);margin:0 0 2px}
.staff-empid{font-size:12px;color:var(--primary);font-weight:600;margin:0 0 4px}
.staff-email{font-size:12px;color:var(--text-muted);margin:0}
.staff-card-body{padding:14px 16px}
.info-row{display:flex;justify-content:space-between;margin-bottom:8px;font-size:13px}
.info-row .label{color:var(--text-muted)}
.info-row .value{color:var(--text);font-weight:500;text-align:right;max-width:60%}
.staff-card-footer{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap}
.badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase}
.badge-draft{background:rgba(245,158,11,0.15);color:var(--warning)}
.badge-submitted{background:rgba(16,185,129,0.15);color:var(--success)}
.badge-verified{background:rgba(99,102,241,0.15);color:var(--primary)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;overflow-y:auto;padding:20px}
.modal-overlay.active{display:flex;align-items:flex-start;justify-content:center}
.detail-modal{background:var(--card-bg);border-radius:16px;width:100%;max-width:700px;margin:auto;overflow:hidden}
.detail-modal-header{padding:20px 24px;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;justify-content:space-between;align-items:center}
.detail-modal-header h3{color:#fff;margin:0;font-size:18px}
.detail-modal-body{padding:24px;max-height:70vh;overflow-y:auto}
.detail-section{margin-bottom:20px}
.detail-section h4{font-size:13px;color:var(--primary);text-transform:uppercase;letter-spacing:0.5px;margin:0 0 12px;border-bottom:1px solid var(--border);padding-bottom:8px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:500px){.detail-grid{grid-template-columns:1fr}}
.detail-item .dl{font-size:11px;color:var(--text-muted);text-transform:uppercase;margin:0 0 2px}
.detail-item .dv{font-size:14px;color:var(--text);font-weight:500;margin:0}
.doc-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.doc-link{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:rgba(99,102,241,0.1);color:var(--primary);border-radius:8px;font-size:12px;font-weight:600;text-decoration:none;border:1px solid rgba(99,102,241,0.3)}
.doc-link:hover{background:rgba(99,102,241,0.2)}
.declaration-status{padding:12px 16px;border-radius:10px;font-size:13px;margin-top:10px}
.declaration-status.accepted{background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);color:var(--success)}
.declaration-status.pending{background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);color:var(--warning)}
.edit-field{background:var(--input-bg);border:1px solid var(--border);border-radius:6px;padding:6px 10px;color:var(--text);font-size:13px;width:100%;box-sizing:border-box}
.edit-field:focus{outline:none;border-color:var(--primary)}
</style>
</head>
<body>
<div class="admin-wrap">
<div class="page-header">
<div><h2><i class="fas fa-users-cog" style="color:var(--primary)"></i> Staff Directory</h2>
<p>Manage all employee profiles and documents</p></div>
<div style="display:flex;gap:8px">
<button class="btn btn-secondary" onclick="exportCSV()"><i class="fas fa-file-csv"></i> Export CSV</button>
<button class="btn btn-primary" onclick="loadStaff()"><i class="fas fa-sync"></i> Refresh</button>
</div>
</div>
<div class="stats-row">
<div class="stat-card"><div class="icon"><i class="fas fa-users"></i></div><div class="info"><h4>Total Staff</h4><p id="statTotal">-</p></div></div>
<div class="stat-card"><div class="icon"><i class="fas fa-edit" style="color:var(--warning)"></i></div><div class="info"><h4>Draft</h4><p id="statDraft">-</p></div></div>
<div class="stat-card"><div class="icon"><i class="fas fa-clock" style="color:var(--info)"></i></div><div class="info"><h4>Submitted</h4><p id="statSubmitted">-</p></div></div>
<div class="stat-card"><div class="icon"><i class="fas fa-check-double" style="color:var(--success)"></i></div><div class="info"><h4>Verified</h4><p id="statVerified">-</p></div></div>
</div>
<div class="search-bar">
<input type="text" id="searchInput" placeholder="Search by name, ID, mobile..." oninput="filterStaff()"/>
<select id="statusFilter" onchange="filterStaff()">
<option value="">All Status</option>
<option value="draft">Draft</option>
<option value="submitted">Submitted</option>
<option value="verified">Verified</option>
</select>
</div>
<div id="staffGrid" class="staff-grid">
<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-muted)"><i class="fas fa-spinner fa-spin" style="font-size:24px"></i><p>Loading staff profiles...</p></div>
</div>
</div>
<!-- DETAIL MODAL -->
<div class="modal-overlay" id="detailModal">
<div class="detail-modal">
<div class="detail-modal-header">
<h3 id="modalTitle">Staff Details</h3>
<div style="display:flex;gap:8px">
<button class="btn btn-secondary" id="editToggleBtn" onclick="toggleEditMode()" style="padding:6px 14px;font-size:12px"><i class="fas fa-edit"></i> Edit</button>
<button class="btn btn-success" id="verifyBtn" onclick="verifyProfile()" style="padding:6px 14px;font-size:12px;display:none"><i class="fas fa-check"></i> Verify</button>
<button style="background:rgba(255,255,255,0.2);border:none;color:#fff;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:16px" onclick="closeModal()">x</button>
</div>
</div>
<div class="detail-modal-body" id="modalBody"></div>
<div style="padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end" id="modalFooter" style="display:none">
<button class="btn btn-secondary" onclick="closeModal()">Close</button>
<button class="btn btn-primary" id="saveEditBtn" style="display:none" onclick="saveEdit()"><i class="fas fa-save"></i> Save Changes</button>
</div>
</div>
</div>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script>
var firebaseConfig={apiKey:"AIzaSyDWxbVoTBKEfVbZeJNMBsOPsY8p4jJLbPY",authDomain:"turnkeycrm-ce7b8.firebaseapp.com",projectId:"turnkeycrm-ce7b8",storageBucket:"turnkeycrm-ce7b8.appspot.com",messagingSenderId:"178714734274",appId:"1:178714734274:web:9bc49e74801f4ffbab7eea"};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
var db=firebase.firestore();
var auth=firebase.auth();
var allStaff=[];
var currentDocId=null;
var currentDocData=null;
var editMode=false;
var userRole="";
auth.onAuthStateChanged(function(user){
  if(!user){ window.location.href="index.html"; return; }
  db.collection("users").doc(user.email).get().then(function(d){
    if(d.exists) userRole=d.data().role||"";
    if(!["admin","superadmin"].includes(userRole)){
      document.getElementById("staffGrid").innerHTML="<div style=\"grid-column:1/-1;text-align:center;padding:40px;color:var(--danger)\"><i class=\"fas fa-lock\"></i><p>Access denied. Admin only.</p></div>";
      return;
    }
    loadStaff();
  });
});
async function loadStaff(){
  try{
    var snap=await db.collection("staffProfiles").get();
    allStaff=[];
    snap.forEach(function(doc){ allStaff.push({id:doc.id, data:doc.data()}); });
    allStaff.sort(function(a,b){ return (a.data.employeeId||"").localeCompare(b.data.employeeId||""); });
    updateStats();
    renderStaff(allStaff);
  } catch(e){
    document.getElementById("staffGrid").innerHTML="<div style=\"grid-column:1/-1;text-align:center;padding:40px;color:var(--danger)\">Error loading data: "+e.message+"</div>";
  }
}
function updateStats(){
  var draft=0,submitted=0,verified=0;
  allStaff.forEach(function(s){
    var st=s.data.profileStatus||"draft";
    if(st==="draft") draft++;
    else if(st==="submitted") submitted++;
    else if(st==="verified") verified++;
  });
  document.getElementById("statTotal").textContent=allStaff.length;
  document.getElementById("statDraft").textContent=draft;
  document.getElementById("statSubmitted").textContent=submitted;
  document.getElementById("statVerified").textContent=verified;
}
function filterStaff(){
  var q=document.getElementById("searchInput").value.toLowerCase();
  var st=document.getElementById("statusFilter").value;
  var filtered=allStaff.filter(function(s){
    var d=s.data;
    var match=(d.fullName||"").toLowerCase().includes(q)||(d.employeeId||"").toLowerCase().includes(q)||(d.mobile1||"").includes(q)||(d.userEmail||"").toLowerCase().includes(q);
    var statusMatch=!st||(d.profileStatus||"draft")===st;
    return match&&statusMatch;
  });
  renderStaff(filtered);
}
function renderStaff(list){
  var grid=document.getElementById("staffGrid");
  if(list.length===0){ grid.innerHTML="<div style=\"grid-column:1/-1;text-align:center;padding:40px;color:var(--text-muted)\"><i class=\"fas fa-user-slash\" style=\"font-size:32px;margin-bottom:10px\"></i><p>No staff profiles found.</p></div>"; return; }
  var html="";
  list.forEach(function(s){
    var d=s.data;
    var st=d.profileStatus||"draft";
    var initial=(d.fullName||"?").charAt(0).toUpperCase();
    var avatarHtml=d.photoURL ? "<img class=\"staff-avatar\" src=\""+d.photoURL+"\" onerror=\"this.style.display='none'\"/>" : "<div class=\"staff-avatar-placeholder\">"+initial+"</div>";
    var submittedDate=d.submittedAt ? new Date(d.submittedAt.toDate()).toLocaleDateString() : "Not submitted";
    html+="<div class=\"staff-card\">";
    html+="<div class=\"staff-card-top\">";
    html+=avatarHtml;
    html+="<div><p class=\"staff-name\">"+( d.fullName||"Unnamed")+"</p>";
    html+="<p class=\"staff-empid\">"+( d.employeeId||"No ID")+"</p>";
    html+="<p class=\"staff-email\">"+( d.userEmail||"")+"</p></div>";
    html+="</div>";
    html+="<div class=\"staff-card-body\">";
    html+="<div class=\"info-row\"><span class=\"label\">Mobile</span><span class=\"value\">"+( d.mobile1||"-")+"</span></div>";
    html+="<div class=\"info-row\"><span class=\"label\">Emergency</span><span class=\"value\">"+( d.emergencyPhone1||"-")+"</span></div>";
    html+="<div class=\"info-row\"><span class=\"label\">Submitted</span><span class=\"value\">"+submittedDate+"</span></div>";
    html+="<div class=\"info-row\"><span class=\"label\">Declaration</span><span class=\"value\" style=\"color:"+(d.declarationAccepted?"var(--success)":"var(--danger)")+"\">"+( d.declarationAccepted?"Accepted":"Pending")+"</span></div>";
    html+="</div>";
    html+="<div class=\"staff-card-footer\">";
    html+="<span class=\"badge badge-"+st+"\">"+st.toUpperCase()+"</span>";
    html+="<button class=\"btn btn-secondary\" style=\"padding:5px 12px;font-size:12px;margin-left:auto\" onclick=\"openDetail('"+s.id+"')\" ><i class=\"fas fa-eye\"></i> View</button>";
    if(d.driveFolderUrl) html+="<a href=\""+d.driveFolderUrl+"\" target=\"_blank\" class=\"btn btn-info\" style=\"padding:5px 12px;font-size:12px\"><i class=\"fab fa-google-drive\"></i></a>";
    html+="</div>";
    html+="</div>";
  });
  grid.innerHTML=html;
}
function openDetail(uid){
  var found=allStaff.find(function(s){ return s.id===uid; });
  if(!found) return;
  currentDocId=uid;
  currentDocData=found.data;
  editMode=false;
  document.getElementById("editToggleBtn").innerHTML="<i class=\"fas fa-edit\"></i> Edit";
  document.getElementById("saveEditBtn").style.display="none";
  var st=found.data.profileStatus||"draft";
  document.getElementById("verifyBtn").style.display=(st==="submitted")?"inline-flex":"none";
  renderModalContent(found.data, false);
  document.getElementById("detailModal").classList.add("active");
}
function renderModalContent(d, isEdit){
  document.getElementById("modalTitle").textContent=(d.fullName||"Staff")+" - "+(d.employeeId||"");
  var html="";
  html+="<div style=\"display:flex;align-items:center;gap:16px;margin-bottom:20px;padding:16px;background:var(--input-bg);border-radius:12px\">";
  if(d.photoURL) html+="<img src=\""+d.photoURL+"\" style=\"width:70px;height:70px;border-radius:50%;object-fit:cover;border:2px solid var(--border)\"/>";
  else html+="<div style=\"width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;font-weight:700\">"+(d.fullName||"?").charAt(0).toUpperCase()+"</div>";
  html+="<div><h3 style=\"margin:0 0 4px\">"+( d.fullName||"Unnamed")+"</h3>";
  html+="<p style=\"margin:0;color:var(--primary);font-weight:600\">"+( d.employeeId||"No ID")+"</p>";
  html+="<p style=\"margin:2px 0 0;color:var(--text-muted);font-size:12px\">"+( d.userEmail||"")+"</p></div>";
  html+="</div>";
  var sections=[
    {title:"Personal Information",icon:"fa-user",fields:[
      {label:"Full Name",key:"fullName"},{label:"Date of Birth",key:"dateOfBirth"},
      {label:"Blood Group",key:"bloodGroup"},{label:"Gender",key:"gender"},
      {label:"Mobile 1",key:"mobile1"},{label:"Mobile 2",key:"mobile2"},{label:"Mobile 3",key:"mobile3"}
    ]},
    {title:"Address",icon:"fa-map-marker-alt",fields:[
      {label:"Permanent Address",key:"permanentAddress",full:true},
      {label:"Temporary Address",key:"temporaryAddress",full:true}
    ]},
    {title:"Emergency Contact",icon:"fa-phone-alt",fields:[
      {label:"Name",key:"emergencyName"},{label:"Relation",key:"emergencyRelation"},
      {label:"Phone 1",key:"emergencyPhone1"},{label:"Phone 2",key:"emergencyPhone2"},{label:"Phone 3",key:"emergencyPhone3"}
    ]},
    {title:"Identity Documents",icon:"fa-id-card",fields:[
      {label:"Aadhar Number",key:"aadharNumber"},{label:"PAN Number",key:"panNumber"}
    ]},
    {title:"Education",icon:"fa-graduation-cap",fields:[
      {label:"Highest Degree",key:"highestDegree"},{label:"Specialization",key:"specialization"},
      {label:"Institution",key:"institutionName"},{label:"Year of Passing",key:"yearOfPassing"}
    ]},
    {title:"Work Experience",icon:"fa-briefcase",fields:[
      {label:"Total Experience",key:"totalExperience"},{label:"Previous Employer",key:"previousEmployer"},
      {label:"Previous Role",key:"previousRole"},{label:"Reason for Leaving",key:"reasonLeaving"}
    ]},
    {title:"Bank Details",icon:"fa-university",fields:[
      {label:"Bank Name",key:"bankName"},{label:"Account Number",key:"accountNumber"},
      {label:"IFSC Code",key:"ifscCode"},{label:"UPI ID",key:"upiId"}
    ]}
  ];
  sections.forEach(function(sec){
    html+="<div class=\"detail-section\">";
    html+="<h4><i class=\"fas "+sec.icon+"\" style=\"color:var(--primary);margin-right:6px\"></i>"+sec.title+"</h4>";
    html+="<div class=\"detail-grid\">";
    sec.fields.forEach(function(field){
      var val=d[field.key]||"-";
      var colStyle=field.full?"grid-column:1/-1":"";
      html+="<div class=\"detail-item\" style=\""+colStyle+"\">";
      html+="<p class=\"dl\">"+field.label+"</p>";
      if(isEdit){
        html+="<input class=\"edit-field\" data-key=\""+field.key+"\" value=\""+val.replace(/"/g,"&quot;")+"\"/>";
      } else {
        html+="<p class=\"dv\">"+val+"</p>";
      }
      html+="</div>";
    });
    html+="</div></div>";
  });
  html+="<div class=\"detail-section\">";
  html+="<h4><i class=\"fab fa-google-drive\" style=\"color:var(--primary);margin-right:6px\"></i>Documents on Drive</h4>";
  html+="<div class=\"doc-links\">";
  if(d.photoURL) html+="<a href=\""+d.photoURL+"\" target=\"_blank\" class=\"doc-link\"><i class=\"fas fa-camera\"></i> Profile Photo</a>";
  if(d.aadharPhotoURL) html+="<a href=\""+d.aadharPhotoURL+"\" target=\"_blank\" class=\"doc-link\"><i class=\"fas fa-id-card\"></i> Aadhar Card</a>";
  if(d.panPhotoURL) html+="<a href=\""+d.panPhotoURL+"\" target=\"_blank\" class=\"doc-link\"><i class=\"fas fa-file-alt\"></i> PAN Card</a>";
  if(d.degreePhotoURL) html+="<a href=\""+d.degreePhotoURL+"\" target=\"_blank\" class=\"doc-link\"><i class=\"fas fa-graduation-cap\"></i> Degree Certificate</a>";
  if(d.driveFolderUrl) html+="<a href=\""+d.driveFolderUrl+"\" target=\"_blank\" class=\"doc-link\" style=\"background:rgba(16,185,129,0.1);color:var(--success);border-color:rgba(16,185,129,0.3)\"><i class=\"fab fa-google-drive\"></i> Open Folder</a>";
  if(!d.photoURL&&!d.aadharPhotoURL&&!d.panPhotoURL&&!d.degreePhotoURL) html+="<p style=\"color:var(--text-muted);font-size:13px\">No documents uploaded yet.</p>";
  html+="</div></div>";
  html+="<div class=\"detail-section\">";
  html+="<h4><i class=\"fas fa-file-signature\" style=\"color:var(--primary);margin-right:6px\"></i>Declaration Status</h4>";
  if(d.declarationAccepted){
    var ts=d.declarationTimestamp?new Date(d.declarationTimestamp.toDate()).toLocaleString():"Unknown time";
    html+="<div class=\"declaration-status accepted\"><i class=\"fas fa-check-circle\"></i> Declaration accepted by <strong>"+(d.fullName||"")+"</strong> on "+ts+"</div>";
  } else {
    html+="<div class=\"declaration-status pending\"><i class=\"fas fa-clock\"></i> Declaration not yet accepted.</div>";
  }
  html+="</div>";
  document.getElementById("modalBody").innerHTML=html;
  document.getElementById("modalFooter").style.display="flex";
}
function toggleEditMode(){
  editMode=!editMode;
  if(editMode){
    document.getElementById("editToggleBtn").innerHTML="<i class=\"fas fa-times\"></i> Cancel";
    document.getElementById("saveEditBtn").style.display="inline-flex";
    renderModalContent(currentDocData, true);
  } else {
    document.getElementById("editToggleBtn").innerHTML="<i class=\"fas fa-edit\"></i> Edit";
    document.getElementById("saveEditBtn").style.display="none";
    renderModalContent(currentDocData, false);
  }
}
async function saveEdit(){
  var inputs=document.querySelectorAll(".edit-field");
  var updates={};
  inputs.forEach(function(inp){ updates[inp.dataset.key]=inp.value.trim(); });
  updates.lastUpdated=firebase.firestore.FieldValue.serverTimestamp();
  try{
    await db.collection("staffProfiles").doc(currentDocId).update(updates);
    Object.assign(currentDocData, updates);
    var idx=allStaff.findIndex(function(s){ return s.id===currentDocId; });
    if(idx>-1) allStaff[idx].data=currentDocData;
    editMode=false;
    document.getElementById("editToggleBtn").innerHTML="<i class=\"fas fa-edit\"></i> Edit";
    document.getElementById("saveEditBtn").style.display="none";
    renderModalContent(currentDocData, false);
    renderStaff(allStaff);
    alert("Changes saved successfully!");
  } catch(e){ alert("Error saving: "+e.message); }
}
async function verifyProfile(){
  if(!confirm("Mark this profile as VERIFIED?")) return;
  try{
    await db.collection("staffProfiles").doc(currentDocId).update({profileStatus:"verified",verifiedAt:firebase.firestore.FieldValue.serverTimestamp()});
    currentDocData.profileStatus="verified";
    document.getElementById("verifyBtn").style.display="none";
    renderModalContent(currentDocData, false);
    updateStats();
    renderStaff(allStaff);
    alert("Profile verified successfully!");
  } catch(e){ alert("Error: "+e.message); }
}
function closeModal(){
  document.getElementById("detailModal").classList.remove("active");
  currentDocId=null; currentDocData=null; editMode=false;
}
function exportCSV(){
  if(allStaff.length===0){ alert("No data to export."); return; }
  var headers=["Employee ID","Full Name","Email","Mobile 1","Mobile 2","Mobile 3","Blood Group","Permanent Address","Emergency Name","Emergency Phone 1","Emergency Phone 2","Aadhar Number","Highest Degree","Bank Name","Account Number","IFSC","Status","Declaration","Submitted Date"];
  var rows=[headers.join(",")];
  allStaff.forEach(function(s){
    var d=s.data;
    var row=[
      d.employeeId||"",d.fullName||"",d.userEmail||"",
      d.mobile1||"",d.mobile2||"",d.mobile3||"",
      d.bloodGroup||"","\""+( d.permanentAddress||"").replace(/"/g,"\"\"")+"\"",
      d.emergencyName||"",d.emergencyPhone1||"",d.emergencyPhone2||"",
      d.aadharNumber||"",d.highestDegree||"",
      d.bankName||"",d.accountNumber||"",d.ifscCode||"",
      d.profileStatus||"draft",d.declarationAccepted?"Yes":"No",
      d.submittedAt?new Date(d.submittedAt.toDate()).toLocaleDateString():""
    ];
    rows.push(row.join(","));
  });
  var blob=new Blob([rows.join("\n")],{type:"text/csv"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="staff_directory_"+new Date().toISOString().slice(0,10)+".csv";
  a.click();
}
document.getElementById("detailModal").addEventListener("click",function(e){
  if(e.target===this) closeModal();
});
</script>
</body>
</html>
