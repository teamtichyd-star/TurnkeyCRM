<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Attendance Admin - TurnkeyCRM</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
    :root {
      --primary:#c8a96e; --primary-dark:#a07840; --primary-glow:rgba(200,169,110,0.15);
      --dark:#1a1a2e; --darker:#0e0e1a; --card:#16213e; --card2:#1a2550;
      --border:rgba(255,255,255,0.06); --text:#f0f0f0; --subtext:#8888aa;
      --success:#4caf50; --warning:#ff9800; --danger:#f44336; --info:#2196f3;
      --radius:14px; --shadow:0 4px 24px rgba(0,0,0,0.35);
    }
    body { background:var(--darker); color:var(--text); min-height:100vh; }
    .page-loader { position:fixed; inset:0; background:var(--darker); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:15px; z-index:9999; }
    .spinner { width:42px; height:42px; border:3px solid rgba(200,169,110,0.15); border-top-color:var(--primary); border-radius:50%; animation:spin 0.8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .access-denied { padding:60px 20px; text-align:center; color:var(--danger); }
    .access-denied i { font-size:60px; opacity:0.4; margin-bottom:15px; display:block; }
    .page { padding:20px 24px; }
    .top-actions { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:12px; }
    .top-actions h2 { font-size:22px; font-weight:700; }
    .filter-bar { display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; align-items:center; background:var(--card); padding:14px; border-radius:12px; border:1px solid var(--border); }
    .filter-bar select, .filter-bar input { padding:10px 14px; background:var(--card2); border:1px solid var(--border); border-radius:10px; color:var(--text); font-size:13px; outline:none; cursor:pointer; }
    .filter-bar select option { background:var(--dark); }
    .filter-bar label { font-size:11px; color:var(--subtext); text-transform:uppercase; letter-spacing:0.7px; margin-right:4px; }
    .btn { padding:10px 18px; border-radius:10px; border:none; cursor:pointer; font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:8px; }
    .btn-primary { background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:white; }
    .btn-success { background:rgba(76,175,80,0.15); color:var(--success); border:1px solid rgba(76,175,80,0.3); }
    .btn-danger { background:rgba(244,67,54,0.15); color:var(--danger); border:1px solid rgba(244,67,54,0.3); }

    .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:20px; }
    .stat-card { background:linear-gradient(145deg,var(--card2),var(--card)); border-radius:var(--radius); padding:16px; text-align:center; border:1px solid var(--border); box-shadow:var(--shadow); }
    .stat-card h3 { font-size:24px; font-weight:700; }
    .stat-card p { font-size:11px; color:var(--subtext); margin-top:4px; text-transform:uppercase; letter-spacing:0.7px; }
    .stat-card.gold h3 { color:var(--primary); }
    .stat-card.green h3 { color:var(--success); }
    .stat-card.blue h3 { color:var(--info); }
    .stat-card.orange h3 { color:var(--warning); }
    .stat-card.red h3 { color:var(--danger); }

    .table-card { background:linear-gradient(145deg,var(--card2),var(--card)); border-radius:var(--radius); border:1px solid var(--border); overflow:hidden; box-shadow:var(--shadow); margin-bottom:20px; }
    .table-wrapper { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; min-width:800px; }
    th { padding:12px 16px; text-align:left; font-size:11px; color:var(--subtext); text-transform:uppercase; letter-spacing:0.8px; background:rgba(255,255,255,0.02); font-weight:600; border-bottom:1px solid var(--border); }
    td { padding:12px 16px; font-size:13px; border-bottom:1px solid rgba(255,255,255,0.03); }
    tr:hover td { background:rgba(200,169,110,0.04); }
    .badge { padding:3px 10px; border-radius:10px; font-size:11px; font-weight:600; text-transform:uppercase; }
    .badge.present { background:rgba(76,175,80,0.15); color:var(--success); }
    .badge.weekly_off { background:rgba(33,150,243,0.15); color:var(--info); }
    .badge.holiday { background:rgba(255,152,0,0.15); color:var(--warning); }
    .badge.leave { background:rgba(156,39,176,0.15); color:#ce93d8; }
    .review-head { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; padding:14px 16px; border-bottom:1px solid var(--border); }
    .review-head h3 { font-size:15px; }
    .review-emp { padding:12px 16px; border-bottom:1px solid rgba(255,255,255,0.04); }
    .review-emp > strong { font-size:14px; }
    .review-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:8px 0; }
    .review-row .rdate { min-width:110px; font-size:12px; color:var(--subtext); }
    .review-row input { padding:7px 10px; background:var(--card2); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:12px; width:150px; outline:none; }
    .mk { padding:6px 11px; border-radius:8px; border:1px solid var(--border); background:var(--card2); color:var(--text); font-size:11.5px; font-weight:600; cursor:pointer; }
    .mk:hover { border-color:var(--primary); color:var(--primary); }
    .mk.red:hover { border-color:var(--danger); color:var(--danger); }
    .hide-cal { display:none !important; }
    .cal-head { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; padding:14px 16px; border-bottom:1px solid var(--border); }
    .cal-head h3 { font-size:16px; }
    .cal-legend { display:flex; gap:12px; flex-wrap:wrap; font-size:11px; color:var(--subtext); }
    .cal-legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; vertical-align:-1px; }
    .cal-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px; padding:14px 16px 18px; }
    .cal-dow { font-size:11px; color:var(--subtext); text-transform:uppercase; letter-spacing:.7px; text-align:center; padding-bottom:2px; }
    .cal-day { min-height:86px; border-radius:10px; padding:7px 8px; border:1px solid var(--border); background:var(--card2); cursor:pointer; display:flex; flex-direction:column; gap:3px; overflow:hidden; text-align:left; color:var(--text); font-size:11px; }
    .cal-day:hover { border-color:var(--primary); }
    .cal-day.blank { background:transparent; border:none; cursor:default; }
    .cal-day.future { opacity:.35; cursor:not-allowed; }
    .cal-day.today { box-shadow:0 0 0 1.5px var(--primary); }
    .cal-day .dn { font-size:13px; font-weight:700; }
    .cal-day .st { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; }
    .cal-day .sub { font-size:10.5px; color:var(--subtext); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .cal-day.present { background:rgba(76,175,80,0.14); border-color:rgba(76,175,80,0.35); } .cal-day.present .st { color:var(--success); }
    .cal-day.weekly_off { background:rgba(33,150,243,0.14); border-color:rgba(33,150,243,0.35); } .cal-day.weekly_off .st { color:var(--info); }
    .cal-day.holiday { background:rgba(255,152,0,0.14); border-color:rgba(255,152,0,0.35); } .cal-day.holiday .st { color:var(--warning); }
    .cal-day.leave { background:rgba(156,39,176,0.14); border-color:rgba(156,39,176,0.35); } .cal-day.leave .st { color:#ce93d8; }
    .cal-day.absent { background:rgba(244,67,54,0.14); border-color:rgba(244,67,54,0.4); } .cal-day.absent .st { color:var(--danger); }
    .cal-day.norec { border-style:dashed; border-color:rgba(244,67,54,0.45); } .cal-day.norec .st { color:var(--danger); }
    .modal-ov { position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:9000; display:none; align-items:center; justify-content:center; padding:16px; }
    .modal-ov.show { display:flex; }
    .modal-box { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px; width:100%; max-width:380px; box-shadow:var(--shadow); }
    .modal-box h3 { font-size:16px; margin-bottom:4px; }
    .modal-box .msub { font-size:12px; color:var(--subtext); margin-bottom:14px; }
    .opt-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
    .opt { padding:11px 8px; border-radius:10px; border:1.5px solid var(--border); background:var(--card2); color:var(--text); font-size:13px; font-weight:600; cursor:pointer; }
    .opt.sel { border-color:var(--primary); background:var(--primary-glow); color:var(--primary); }
    .modal-box input[type=text] { width:100%; padding:10px 12px; background:var(--card2); border:1px solid var(--border); border-radius:10px; color:var(--text); font-size:13px; outline:none; margin-bottom:14px; }
    .modal-actions { display:flex; gap:8px; justify-content:space-between; }
    @media (max-width:768px) { .cal-grid { gap:4px; padding:10px 8px 14px; } .cal-day { min-height:64px; padding:5px; } .cal-day .sub { display:none; } }
    .badge.absent { background:rgba(244,67,54,0.15); color:var(--danger); }
    .badge.late { background:rgba(255,152,0,0.15); color:var(--warning); margin-left:4px; }
    .map-link { color:var(--primary); text-decoration:none; font-size:12px; }
    .map-link:hover { text-decoration:underline; }
    .empty-state { padding:50px 20px; text-align:center; color:var(--subtext); }
    .toast { position:fixed; bottom:90px; right:20px; background:var(--success); color:white; padding:12px 20px; border-radius:11px; font-size:13.5px; z-index:9999; display:none; box-shadow:0 6px 24px rgba(0,0,0,0.35); }

    .view-toggle { display:flex; gap:6px; background:var(--card); padding:4px; border-radius:10px; border:1px solid var(--border); }
    .view-toggle button { padding:8px 14px; border-radius:8px; border:none; background:transparent; color:var(--subtext); font-size:12px; font-weight:600; cursor:pointer; }
    .view-toggle button.active { background:var(--primary-glow); color:var(--primary); }

    @media (max-width:768px) {
      .page { padding:14px; }
      .filter-bar { flex-direction:column; align-items:stretch; }
      .filter-bar select, .filter-bar input { width:100%; }
    }
  </style>
</head>
<body>

<div class="page-loader" id="pageLoader"><div class="spinner"></div><p style="color:var(--subtext);font-size:13px;letter-spacing:1px">Loading...</p></div>
<div class="toast" id="toast"></div>

<div class="modal-ov" id="dayModal" onclick="if(event.target===this)closeDay()">
  <div class="modal-box">
    <h3 id="dmTitle"></h3>
    <div class="msub" id="dmSub"></div>
    <div class="opt-grid" id="dmOpts"></div>
    <input type="text" id="dmNote" placeholder="Note (optional)"/>
    <div class="modal-actions">
      <button class="btn btn-danger" id="dmClear" onclick="clearDay()"><i class="fas fa-eraser"></i> Clear</button>
      <div style="display:flex;gap:8px">
        <button class="btn" style="background:var(--card2);color:var(--text);border:1px solid var(--border)" onclick="closeDay()">Cancel</button>
        <button class="btn btn-primary" onclick="saveDay()"><i class="fas fa-check"></i> Save</button>
      </div>
    </div>
  </div>
</div>

<div id="deniedScreen" class="access-denied" style="display:none">
  <i class="fas fa-lock"></i>
  <h2>Access Denied</h2>
  <p>Only Admin / Super Admin can view this page</p>
</div>

<div class="page" id="mainPage" style="display:none">

  <div class="top-actions">
    <h2>📊 Attendance Admin</h2>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-success" onclick="exportSummaryCSV()"><i class="fas fa-file-csv"></i> Export Summary</button>
      <button class="btn btn-success" onclick="exportDetailCSV()"><i class="fas fa-file-csv"></i> Export Detail</button>
      <button class="btn btn-danger" onclick="cleanupOld()"><i class="fas fa-broom"></i> Cleanup (60d+)</button>
    </div>
  </div>

  <div class="filter-bar">
    <div><label>Month:</label><select id="monthFilter" onchange="onMonthChange()"></select></div>
    <div><label>Date:</label><input type="date" id="dateFilter" onchange="render()"/><button onclick="clearDateFilter()" style="padding:8px 12px;background:rgba(244,67,54,0.12);border:1px solid rgba(244,67,54,0.2);border-radius:8px;color:var(--danger);cursor:pointer;font-size:11px;margin-left:4px">Clear</button></div>
    <div><label>User:</label><select id="userFilter" onchange="render()"><option value="">All Users</option></select></div>
    <div><label>View:</label>
      <div class="view-toggle">
        <button id="vSummary" class="active" onclick="setView('summary')">Summary</button>
        <button id="vDetail" onclick="setView('detail')">Detail</button>
        <button id="vCalendar" onclick="setView('calendar')">Calendar</button>
      </div>
    </div>
  </div>

  <div class="table-card" id="reviewCard" style="display:none">
    <div class="review-head">
      <h3>⚠️ Attendance not recorded — mark status for each employee</h3>
      <div><label style="font-size:11px;color:var(--subtext);text-transform:uppercase;margin-right:6px">Look back</label>
        <select id="reviewDays" onchange="loadReview()" style="padding:7px 10px;background:var(--card2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px">
          <option value="1">Yesterday</option><option value="3">Last 3 days</option><option value="7">Last 7 days</option>
        </select></div>
    </div>
    <div id="reviewList"></div>
  </div>

  <div class="stats-grid" id="statsGrid"></div>

  <div class="table-card">
    <div class="table-wrapper" id="tableWrap"></div>
  </div>

</div>

<script>
const firebaseConfig = {
  apiKey:"AIzaSyBLQhUZA-VN4_A9FhQWmlRSQZC2D95KoE8",
  authDomain:"turnkeycrm-ce7b8.firebaseapp.com",
  projectId:"turnkeycrm-ce7b8",
  storageBucket:"turnkeycrm-ce7b8.firebasestorage.app",
  messagingSenderId:"487224108102",
  appId:"1:487224108102:web:dbe9d4ea6abdb2db581647"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

let allUsers = [];
let allRecords = [];
let currentView = 'summary';
let projectUpdateDates = {}; // projectId -> Set of dates with a daily update
let currentAdminEmail = '';

function onMonthChange() {
  document.getElementById('dateFilter').value = '';
  loadData();
}
function clearDateFilter() {
  document.getElementById('dateFilter').value = '';
  render();
}

const LATE_TIME = '10:30';

function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = type==='danger'?'var(--danger)':type==='warning'?'var(--warning)':'var(--success)';
  t.style.display = 'block';
  setTimeout(()=>{ t.style.display='none'; }, 3000);
}

function fillMonthSelect() {
  const sel = document.getElementById('monthFilter');
  const months = [];
  const now = new Date();
  for (let i=0; i<6; i++) {
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const val = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    const label = d.toLocaleDateString('en-IN',{month:'long',year:'numeric'});
    months.push('<option value="'+val+'">'+label+'</option>');
  }
  sel.innerHTML = months.join('');
}

async function loadUsers() {
  try {
    const snap = await db.collection('users').get();
    allUsers = [];
    snap.forEach(d => { const u = d.data(); allUsers.push({ email: u.email||d.id, name: u.name||u.email, role: u.role||'' }); });
    allUsers.sort((a,b) => a.name.localeCompare(b.name));
    const sel = document.getElementById('userFilter');
    sel.innerHTML = '<option value="">All Users</option>' + allUsers.map(u => '<option value="'+u.email+'">'+u.name+'</option>').join('');
  } catch(e) { console.error(e); }
}

async function loadData() {
  const month = document.getElementById('monthFilter').value;
  const [y,m] = month.split('-').map(Number);
  const start = y+'-'+String(m).padStart(2,'0')+'-01';
  const endDate = new Date(y, m, 0).getDate();
  const end = y+'-'+String(m).padStart(2,'0')+'-'+String(endDate).padStart(2,'0');
  try {
    const snap = await db.collection('attendance').where('date','>=',start).where('date','<=',end).get();
    allRecords = [];
    snap.forEach(d => allRecords.push(d.data()));
    await loadProjectUpdates();
    render();
  } catch(e) { console.error(e); showToast('Load error: '+e.message,'danger'); }
}

async function loadProjectUpdates() {
  if (Object.keys(projectUpdateDates).length) return;
  try {
    const snap = await db.collection('projects').get();
    snap.forEach(d => { projectUpdateDates[d.id] = new Set((d.data().updates||[]).map(u => u.date)); });
  } catch(e) { console.error(e); }
}

function reportMissing(r) {
  const t = new Date().toISOString().split('T')[0];
  if (r.type !== 'present' || !r.projectId || r.projectId === 'office' || r.date >= t) return false;
  const s = projectUpdateDates[r.projectId];
  return !(s && s.has(r.date));
}

function setView(v) {
  currentView = v;
  document.getElementById('vSummary').classList.toggle('active', v==='summary');
  document.getElementById('vDetail').classList.toggle('active', v==='detail');
  document.getElementById('vCalendar').classList.toggle('active', v==='calendar');
  if (v==='calendar' && !document.getElementById('userFilter').value && allUsers.length) {
    document.getElementById('userFilter').value = allUsers[0].email;
  }
  render();
}

function render() {
  document.getElementById('reviewCard').classList.toggle('hide-cal', currentView==='calendar');
  if (currentView === 'summary') renderSummary();
  else if (currentView === 'calendar') renderCalendar();
  else renderDetail();
}

function buildUserSummary(userEmail, records, y, m) {
  const _df = (document.getElementById('dateFilter') || {}).value || '';
  let userRecs = records.filter(r => r.userEmail === userEmail);
  if (_df) userRecs = userRecs.filter(r => r.date === _df);
  const present = userRecs.filter(r => r.type==='present').length;
  const off = userRecs.filter(r => r.type==='weekly_off').length;
  const hol = userRecs.filter(r => r.type==='holiday').length;
  const leave = userRecs.filter(r => r.type==='leave').length;
  const repMissing = userRecs.filter(reportMissing).length;
  const daysInMonth = new Date(y, m, 0).getDate();
  const today = new Date();
  const isCurrent = (today.getFullYear()===y && (today.getMonth()+1)===m);
  const daysCounted = isCurrent ? today.getDate() : daysInMonth;
  const absent = Math.max(0, daysCounted - present - off - hol - leave);
  const presentRecs = userRecs.filter(r => r.type==='present' && r.time);
  let avgTime = '-', lateCount = 0, firstDate = '-', lastDate = '-';
  if (presentRecs.length) {
    const sorted = [...presentRecs].sort((a,b) => a.date.localeCompare(b.date));
    firstDate = sorted[0].date;
    lastDate = sorted[sorted.length-1].date;
    var latest = sorted[sorted.length-1];
    var lastProject = latest.projectName || '-';
    var lastAddress = latest.gpsAddress || '';
    const totalMin = presentRecs.reduce((s,r) => {
      const [hh,mm] = r.time.split(':').map(Number);
      const min = hh*60+mm;
      const [lh,lm] = LATE_TIME.split(':').map(Number);
      if (min > lh*60+lm) lateCount++;
      return s + min;
    }, 0);
    const avg = Math.round(totalMin / presentRecs.length);
    avgTime = String(Math.floor(avg/60)).padStart(2,'0')+':'+String(avg%60).padStart(2,'0');
  }
  const finalDays = _df ? 1 : daysCounted;
  const finalAbsent = _df ? Math.max(0, 1 - present - off - hol - leave) : absent;
  return { present, off, hol, leave, repMissing, absent: finalAbsent, avgTime, lateCount, firstDate, lastDate, totalDays: finalDays, lastProject: (typeof lastProject !== 'undefined' ? lastProject : '-'), lastAddress: (typeof lastAddress !== 'undefined' ? lastAddress : '') };
}

function renderSummary() {
  const month = document.getElementById('monthFilter').value;
  const [y,m] = month.split('-').map(Number);
  const userFilter = document.getElementById('userFilter').value;
  const dateFilter = document.getElementById('dateFilter').value;
  const users = userFilter ? allUsers.filter(u => u.email === userFilter) : allUsers;

  // Top stats
  let totalPresent=0, totalOff=0, totalHol=0, totalAbsent=0, totalLate=0, totalLeave=0, totalRep=0;
  const summaries = users.map(u => {
    const s = buildUserSummary(u.email, allRecords, y, m);
    totalPresent += s.present;
    totalOff += s.off;
    totalHol += s.hol;
    totalAbsent += s.absent;
    totalLate += s.lateCount;
    totalLeave += s.leave;
    totalRep += s.repMissing;
    return { user: u, ...s };
  });

  document.getElementById('statsGrid').innerHTML =
    '<div class="stat-card gold"><h3>'+users.length+'</h3><p>Users</p></div>'+
    '<div class="stat-card green"><h3>'+totalPresent+'</h3><p>Present</p></div>'+
    '<div class="stat-card blue"><h3>'+totalOff+'</h3><p>Weekly Off</p></div>'+
    '<div class="stat-card orange"><h3>'+totalHol+'</h3><p>Holiday</p></div>'+
    '<div class="stat-card red"><h3>'+totalAbsent+'</h3><p>Absent</p></div>'+
    '<div class="stat-card blue"><h3>'+totalLeave+'</h3><p>Leave</p></div>'+
    '<div class="stat-card red"><h3>'+totalRep+'</h3><p>Reports Missing</p></div>'+
    '<div class="stat-card orange"><h3>'+totalLate+'</h3><p>Late Days</p></div>';

  const rows = summaries.map(s => '<tr>'+
    '<td><strong>'+s.user.name+'</strong><br><small style="color:var(--subtext)">'+s.user.email+'</small></td>'+
    '<td>'+s.totalDays+'</td>'+
    '<td><span class="badge present">'+s.present+'</span></td>'+
    '<td><span class="badge weekly_off">'+s.off+'</span></td>'+
    '<td><span class="badge holiday">'+s.hol+'</span></td>'+
    '<td><span class="badge leave">'+s.leave+'</span></td>'+
    '<td><span class="badge absent">'+s.absent+'</span></td>'+
    '<td>'+(s.repMissing>0?'<span class="badge absent">'+s.repMissing+'</span>':'0')+'</td>'+
    '<td>'+s.avgTime+'</td>'+
    '<td>'+(s.lateCount>0?'<span class="badge late">'+s.lateCount+'</span>':'0')+'</td>'+
    '<td><div style="font-size:12px"><div>📍 '+s.lastProject+'</div>'+(s.lastAddress?'<div style="color:var(--subtext);font-size:11px;margin-top:3px">🌍 '+s.lastAddress.substring(0,60)+(s.lastAddress.length>60?'...':'')+'</div>':'')+'</div></td>'+
    '</tr>').join('');

  document.getElementById('tableWrap').innerHTML =
    '<table><thead><tr>'+
    '<th>User</th><th>Days</th><th>Present</th><th>Off</th><th>Holiday</th><th>Leave</th><th>Absent</th><th>Reports Missing</th><th>Avg Time</th><th>Late</th><th>Last Location</th>'+
    '</tr></thead><tbody>'+(rows || '<tr><td colspan="11"><div class="empty-state">No data</div></td></tr>')+'</tbody></table>';
}

function renderDetail() {
  const userFilter = document.getElementById('userFilter').value;
  let recs = userFilter ? allRecords.filter(r => r.userEmail === userFilter) : allRecords;
  const _df = document.getElementById('dateFilter').value;
  if (_df) recs = recs.filter(r => r.date === _df);
  recs = [...recs].sort((a,b) => b.date.localeCompare(a.date) || (b.time||'').localeCompare(a.time||''));

  document.getElementById('statsGrid').innerHTML = '';

  const rows = recs.map(r => {
    const [lh,lm] = LATE_TIME.split(':').map(Number);
    let lateBadge = '';
    if (r.type==='present' && r.time) {
      const [hh,mm] = r.time.split(':').map(Number);
      if (hh*60+mm > lh*60+lm) lateBadge = '<span class="badge late">LATE</span>';
    }
    const gps = (r.gpsLat && r.gpsLng) ? '<a class="map-link" href="https://maps.google.com/?q='+r.gpsLat+','+r.gpsLng+'" target="_blank">📍 Map</a>' : '-';
    return '<tr>'+
      '<td>'+r.date+'</td>'+
      '<td><strong>'+(r.userName||r.userEmail)+'</strong></td>'+
      '<td><span class="badge '+r.type+'">'+r.type.replace('_',' ')+'</span>'+lateBadge+'</td>'+
      '<td>'+(r.time||'-')+'</td>'+
      '<td>'+(r.projectName||'-')+'</td>'+
      '<td>'+gps+'</td>'+
      '<td><small style="color:var(--subtext)">'+(r.gpsAddress||'-').substring(0,60)+'</small></td>'+
      '<td><small>'+(r.notes||'-')+'</small></td>'+
      '<td>'+(r.type==='present' && r.projectId && r.projectId!=='office' ? (reportMissing(r)?'<span class="badge absent">Missing</span>':(r.date>=new Date().toISOString().split('T')[0]?'-':'<span class="badge present">Filed</span>')) : '-')+'</td>'+
      '</tr>';
  }).join('');

  document.getElementById('tableWrap').innerHTML =
    '<table><thead><tr>'+
    '<th>Date</th><th>User</th><th>Type</th><th>Time</th><th>Project</th><th>GPS</th><th>Address</th><th>Notes</th><th>Daily Report</th>'+
    '</tr></thead><tbody>'+(rows || '<tr><td colspan="9"><div class="empty-state">No records</div></td></tr>')+'</tbody></table>';
}

const REVIEW_OPTS = [['absent','Absent','red'],['leave','Leave',''],['holiday','Holiday',''],['weekly_off','Weekly Off',''],['present','Present','']];

async function loadReview() {
  const days = parseInt(document.getElementById('reviewDays').value, 10);
  const dates = [];
  for (let i=1; i<=days; i++) { const d = new Date(); d.setDate(d.getDate()-i); dates.push(d.toISOString().split('T')[0]); }
  const from = dates[dates.length-1], to = dates[0];
  const list = document.getElementById('reviewList');
  const card = document.getElementById('reviewCard');
  try {
    const snap = await db.collection('attendance').where('date','>=',from).where('date','<=',to).get();
    const have = new Set(); snap.forEach(d => { const r = d.data(); have.add((r.userEmail||'').toLowerCase()+'|'+r.date); });
    let html = '';
    allUsers.forEach(u => {
      const miss = dates.filter(dt => !have.has(u.email.toLowerCase()+'|'+dt));
      if (!miss.length) return;
      html += '<div class="review-emp"><strong>'+u.name+'</strong> <small style="color:var(--subtext)">'+u.email+'</small>'+
        miss.map(dt => {
          const lbl = new Date(dt+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
          return '<div class="review-row" data-email="'+u.email+'" data-name="'+u.name.replace(/"/g,'&quot;')+'" data-date="'+dt+'"><span class="rdate">'+lbl+'</span>'+
            '<input type="text" placeholder="Note (optional)"/>'+
            REVIEW_OPTS.map(o => '<button class="mk '+o[2]+'" onclick="markFor(this,\''+o[0]+'\')">'+o[1]+'</button>').join('')+'</div>';
        }).join('')+'</div>';
    });
    card.style.display = html ? 'block' : 'none';
    list.innerHTML = html;
  } catch(e) { console.error(e); showToast('Review load error: '+e.message,'danger'); }
}

async function markFor(btn, type) {
  const row = btn.closest('.review-row');
  const email = row.dataset.email, name = row.dataset.name, date = row.dataset.date;
  const id = email.replace(/[.@]/g,'_')+'_'+date;
  btn.disabled = true;
  try {
    await db.collection('attendance').doc(id).set({
      userEmail: email, userName: name, date: date, time: '', type: type,
      notes: row.querySelector('input').value.trim(),
      markedByAdmin: currentAdminEmail,
      createdAt: new Date().toISOString()
    });
    showToast('Saved: '+name+' — '+type.replace('_',' '));
    const emp = row.closest('.review-emp');
    row.remove();
    if (!emp.querySelector('.review-row')) emp.remove();
    if (!document.querySelector('#reviewList .review-emp')) document.getElementById('reviewCard').style.display = 'none';
    loadData();
  } catch(e) { btn.disabled = false; showToast('Error: '+e.message,'danger'); }
}

// ─── CALENDAR VIEW ───
const DAY_TYPES = [['present','Present'],['absent','Absent'],['leave','Leave'],['holiday','Holiday'],['weekly_off','Weekly Off']];
const TYPE_LABEL = { present:'Present', absent:'Absent', leave:'Leave', holiday:'Holiday', weekly_off:'Weekly Off' };
let dayCtx = null; // { user, date, rec, type }

function renderCalendar() {
  const month = document.getElementById('monthFilter').value;
  const [y,m] = month.split('-').map(Number);
  const email = document.getElementById('userFilter').value;
  const user = allUsers.find(u => u.email === email);
  if (!user) { document.getElementById('statsGrid').innerHTML=''; document.getElementById('tableWrap').innerHTML='<div class="empty-state">Select a user to see the calendar</div>'; return; }
  const recs = {};
  allRecords.filter(r => r.userEmail === email).forEach(r => { recs[r.date] = r; });
  const todayStr = new Date().toISOString().split('T')[0];
  const daysInMonth = new Date(y, m, 0).getDate();
  const firstDow = (new Date(y, m-1, 1).getDay() + 6) % 7; // Monday-first
  const c = { present:0, weekly_off:0, holiday:0, leave:0, absent:0, late:0 };
  const [lh,lm] = LATE_TIME.split(':').map(Number);
  let cells = '';
  ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(d => cells += '<div class="cal-dow">'+d+'</div>');
  for (let i=0; i<firstDow; i++) cells += '<div class="cal-day blank"></div>';
  for (let d=1; d<=daysInMonth; d++) {
    const date = y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const r = recs[date];
    const future = date > todayStr;
    let cls = '', st = '', sub = '';
    if (future) { cls = 'future'; }
    else if (r) {
      cls = r.type; st = TYPE_LABEL[r.type] || r.type; c[r.type] = (c[r.type]||0)+1;
      if (r.type==='present') {
        sub = (r.time||'') + (r.projectName ? ' · '+r.projectName : '');
        if (r.time) { const [hh,mm] = r.time.split(':').map(Number); if (hh*60+mm > lh*60+lm) c.late++; }
      } else sub = r.notes || '';
      if (r.markedByAdmin) sub += (sub?' ':'')+'(admin)';
    } else { cls = 'norec'; st = 'No record'; c.absent++; }
    if (date === todayStr) cls += ' today';
    cells += '<div class="cal-day '+cls+'" '+(future?'':'onclick="openDay(\''+date+'\')"')+'><span class="dn">'+d+'</span>'+(st?'<span class="st">'+st+'</span>':'')+(sub?'<span class="sub">'+sub.replace(/</g,'&lt;')+'</span>':'')+'</div>';
  }
  document.getElementById('statsGrid').innerHTML =
    '<div class="stat-card green"><h3>'+c.present+'</h3><p>Present</p></div>'+
    '<div class="stat-card blue"><h3>'+c.weekly_off+'</h3><p>Weekly Off</p></div>'+
    '<div class="stat-card orange"><h3>'+c.holiday+'</h3><p>Holiday</p></div>'+
    '<div class="stat-card blue"><h3>'+c.leave+'</h3><p>Leave</p></div>'+
    '<div class="stat-card red"><h3>'+c.absent+'</h3><p>Absent</p></div>'+
    '<div class="stat-card orange"><h3>'+c.late+'</h3><p>Late Days</p></div>';
  const label = new Date(y, m-1, 1).toLocaleDateString('en-IN',{month:'long',year:'numeric'});
  document.getElementById('tableWrap').innerHTML =
    '<div class="cal-head"><h3>'+user.name+' — '+label+'</h3><div class="cal-legend">'+
    '<span><i style="background:var(--success)"></i>Present</span><span><i style="background:var(--danger)"></i>Absent / No record</span>'+
    '<span><i style="background:#ce93d8"></i>Leave</span><span><i style="background:var(--warning)"></i>Holiday</span><span><i style="background:var(--info)"></i>Weekly Off</span></div></div>'+
    '<div class="cal-grid">'+cells+'</div>';
}

function openDay(date) {
  const email = document.getElementById('userFilter').value;
  const user = allUsers.find(u => u.email === email);
  const rec = allRecords.find(r => r.userEmail === email && r.date === date) || null;
  dayCtx = { user, date, rec, type: rec ? rec.type : '' };
  const lbl = new Date(date+'T00:00:00').toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  document.getElementById('dmTitle').textContent = user.name;
  document.getElementById('dmSub').textContent = lbl + (rec ? ' · currently ' + (TYPE_LABEL[rec.type]||rec.type) + (rec.time?' at '+rec.time:'') : ' · no record');
  document.getElementById('dmNote').value = rec ? (rec.notes||'') : '';
  document.getElementById('dmClear').style.display = rec ? '' : 'none';
  document.getElementById('dmOpts').innerHTML = DAY_TYPES.map(o => '<button class="opt'+(dayCtx.type===o[0]?' sel':'')+'" data-t="'+o[0]+'" onclick="pickType(\''+o[0]+'\')">'+o[1]+'</button>').join('');
  document.getElementById('dayModal').classList.add('show');
}
function pickType(t) {
  dayCtx.type = t;
  document.querySelectorAll('#dmOpts .opt').forEach(b => b.classList.toggle('sel', b.dataset.t === t));
}
function closeDay() { document.getElementById('dayModal').classList.remove('show'); dayCtx = null; }

async function saveDay() {
  if (!dayCtx || !dayCtx.type) { showToast('Pick a status','warning'); return; }
  const { user, date, rec, type } = dayCtx;
  if (rec && rec.type==='present' && rec.gpsLat && type!=='present' && !confirm('This is a GPS-verified Present record. Replace it with '+TYPE_LABEL[type]+'?')) return;
  const notes = document.getElementById('dmNote').value.trim();
  const id = user.email.replace(/[.@]/g,'_')+'_'+date;
  let data;
  if (rec && rec.type === type) { data = { ...rec, notes: notes, markedByAdmin: currentAdminEmail }; } // same status: keep GPS/project, update note
  else data = { userEmail: user.email, userName: user.name, date: date, time: '', type: type, notes: notes, markedByAdmin: currentAdminEmail, createdAt: new Date().toISOString() };
  try {
    await db.collection('attendance').doc(id).set(data);
    allRecords = allRecords.filter(r => !(r.userEmail===user.email && r.date===date)); allRecords.push(data);
    closeDay(); render(); loadReview();
    showToast('Saved: '+user.name+' — '+TYPE_LABEL[type]+' ('+date+')');
  } catch(e) { showToast('Error: '+e.message,'danger'); }
}

async function clearDay() {
  if (!dayCtx || !dayCtx.rec) return;
  const { user, date } = dayCtx;
  if (!confirm('Delete the attendance record for '+user.name+' on '+date+'?')) return;
  try {
    await db.collection('attendance').doc(user.email.replace(/[.@]/g,'_')+'_'+date).delete();
    allRecords = allRecords.filter(r => !(r.userEmail===user.email && r.date===date));
    closeDay(); render(); loadReview();
    showToast('Record cleared');
  } catch(e) { showToast('Error: '+e.message,'danger'); }
}

function exportSummaryCSV() {
  const month = document.getElementById('monthFilter').value;
  const [y,m] = month.split('-').map(Number);
  const headers = ['Name','Email','Total Days','Present','Weekly Off','Holiday','Leave','Absent','Reports Missing','Avg Reporting Time','Late Days','First Check-in','Last Check-in'];
  const rows = allUsers.map(u => {
    const s = buildUserSummary(u.email, allRecords, y, m);
    return [u.name, u.email, s.totalDays, s.present, s.off, s.hol, s.leave, s.absent, s.repMissing, s.avgTime, s.lateCount, s.firstDate, s.lastDate];
  });
  const csv = [headers, ...rows].map(r => r.map(c => '"'+(c||'').toString().replace(/"/g,'""')+'"').join(',')).join('\n');
  downloadCSV(csv, 'Attendance_Summary_'+month+'.csv');
}

function exportDetailCSV() {
  const month = document.getElementById('monthFilter').value;
  const headers = ['Date','User','Email','Type','Time','Project','GPS Lat','GPS Lng','Address','Notes'];
  const recs = [...allRecords].sort((a,b) => a.date.localeCompare(b.date) || (a.time||'').localeCompare(b.time||''));
  const rows = recs.map(r => [r.date, r.userName||'', r.userEmail||'', r.type, r.time||'', r.projectName||'', r.gpsLat||'', r.gpsLng||'', r.gpsAddress||'', r.notes||'']);
  const csv = [headers, ...rows].map(r => r.map(c => '"'+(c||'').toString().replace(/"/g,'""')+'"').join(',')).join('\n');
  downloadCSV(csv, 'Attendance_Detail_'+month+'.csv');
}

function downloadCSV(csv, name) {
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  showToast('✅ Exported!');
}

async function cleanupOld() {
  if (!confirm('Delete attendance records older than 60 days? This cannot be undone.')) return;
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate()-60);
  const cutoffStr = cutoff.toISOString().split('T')[0];
  try {
    const snap = await db.collection('attendance').where('date','<',cutoffStr).get();
    if (snap.empty) { showToast('No old records to delete'); return; }
    const batch = db.batch();
    let count = 0;
    snap.forEach(d => { batch.delete(d.ref); count++; });
    await batch.commit();
    showToast('🗑️ Deleted '+count+' old records');
    loadData();
  } catch(e) { showToast('Error: '+e.message,'danger'); }
}

firebase.auth().onAuthStateChanged(async function(user) {
  if (!user) { window.location.href='index.html'; return; }
  try {
    const userDoc = await db.collection('users').doc(user.email).get();
    const role = userDoc.exists ? (userDoc.data().role||'') : '';
    if (!['admin','superadmin'].includes(role)) {
      document.getElementById('pageLoader').style.display='none';
      document.getElementById('deniedScreen').style.display='block';
      return;
    }
  } catch(e) {
    document.getElementById('pageLoader').style.display='none';
    document.getElementById('deniedScreen').style.display='block';
    return;
  }
  fillMonthSelect();
  await loadUsers();
  currentAdminEmail = user.email;
  await loadData();
  await loadReview();
  // Auto-cleanup on admin open (silent, runs in background)
  setTimeout(silentCleanup, 3000);
  document.getElementById('pageLoader').style.display='none';
  document.getElementById('mainPage').style.display='block';
});

async function silentCleanup() {
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate()-60);
  const cutoffStr = cutoff.toISOString().split('T')[0];
  try {
    const snap = await db.collection('attendance').where('date','<',cutoffStr).get();
    if (snap.empty) return;
    const batch = db.batch();
    snap.forEach(d => batch.delete(d.ref));
    await batch.commit();
    console.log('Silent cleanup: removed', snap.size, 'old records');
  } catch(e) { console.log('Silent cleanup skipped:', e.message); }
}
