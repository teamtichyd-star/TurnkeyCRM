<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Turnkey CRM</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"></script>
</head>
<body>
    <h1>Turnkey CRM</h1>
    <p id="welcome">Loading...</p>

    <div id="admin-section" style="display: none;">
        <h2>Add New User</h2>
        <form id="addUserForm">
            <input type="text" id="name" placeholder="Name" required><br><br>
            <input type="email" id="email" placeholder="Email" required><br><br>
            <input type="password" id="password" placeholder="Password" required><br><br>
            <select id="role" required>
                <option value="admin">Admin</option>
                <option value="purchase">Purchase</option>
                <option value="supervisor">Supervisor</option>
                <option value="design">Design</option>
            </select><br><br>
            <button type="submit">Create User</button>
        </form>
    </div>

    <button onclick="location.href='leads.html'">Leads</button>
    <button onclick="location.href='projects.html'">Projects</button>
    <button onclick="location.href='tasks.html'">Tasks</button>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBLQhUZA-VN4_A9FhQWmlRSQZC2D95KoE8",
            authDomain: "turnkeycrm-ce7b8.firebaseapp.com",
            projectId: "turnkeycrm-ce7b8",
            storageBucket: "turnkeycrm-ce7b8.firebasestorage.app",
            messagingSenderId: "487224108102",
            appId: "1:487224108102:web:dbe9d4ea6abdb2db581647"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                // Fetch using email as document ID (as per your Firestore)
                const doc = await db.collection("users").doc(user.email).get();
                
                if (doc.exists) {
                    const role = doc.data().role;
                    document.getElementById("welcome").innerText = `Welcome ${user.email} (${role})`;

                    if (role === "admin") {
                        document.getElementById("admin-section").style.display = "block";
                    }
                } else {
                    document.getElementById("welcome").innerText = "User data not found in database";
                }
            }
        });
    </script>
</body>
</html>
