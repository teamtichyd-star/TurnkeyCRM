<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turnkey CRM</title>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"></script>
    
    <script type="module" src="js/userManagement.js"></script>
    
    <style>
        body { font-family: Arial; padding: 30px; background: #f5f5f5; }
        .container { max-width: 700px; margin: auto; background: white; padding: 30px; border-radius: 10px; }
        .hidden { display: none; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; }
        button { padding: 10px 20px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Turnkey CRM</h1>
        <p id="welcome">Loading...</p>

        <!-- Admin Section -->
        <div id="admin-section" class="hidden">
            <h2>Add New User</h2>
            <form id="addUserForm">
                <input type="text" id="name" placeholder="Full Name" required>
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Password" required>
                
                <select id="role" required>
                    <option value="">Select Role</option>
                    <option value="admin">Admin</option>
                    <option value="purchase">Purchase</option>
                    <option value="supervisor">Supervisor</option>
                    <option value="design">Design</option>
                </select>
                
                <button type="submit">Create User</button>
            </form>
        </div>

        <div style="margin-top: 30px;">
            <button onclick="location.href='leads.html'">Leads</button>
            <button onclick="location.href='projects.html'">Projects</button>
            <button onclick="location.href='tasks.html'">Tasks</button>
        </div>
    </div>

    <script type="module">
        import { addNewUser } from './js/userManagement.js';

        const firebaseConfig = {
            // ← Paste your Firebase config here
        };

        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Check logged in user and role
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                const userDoc = await db.collection("users").doc(user.uid).get();
                const role = userDoc.data()?.role || "user";

                document.getElementById("welcome").innerText = `Welcome, ${user.email} (${role})`;

                if (role === "admin") {
                    document.getElementById("admin-section").classList.remove("hidden");
                }
            } else {
                window.location.href = "login.html";
            }
        });

        // Add User Form
        document.getElementById("addUserForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const role = document.getElementById("role").value;

            await addNewUser(auth, db, name, email, password, role);
            document.getElementById("addUserForm").reset();
        });
    </script>
</body>
</html>
