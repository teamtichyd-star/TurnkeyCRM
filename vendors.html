<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vendors - TurnkeyCRM</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    :root {
      --primary: #c8a96e; --primary-dark: #a07840;
      --primary-glow: rgba(200,169,110,0.15);
      --dark: #1a1a2e; --darker: #0e0e1a;
      --card: #16213e; --card2: #1a2550;
      --border: rgba(255,255,255,0.06);
      --text: #f0f0f0; --subtext: #8888aa;
      --success: #4caf50; --warning: #ff9800; --danger: #f44336; --info: #2196f3;
      --radius: 14px; --shadow: 0 4px 24px rgba(0,0,0,0.35);
    }
    body { background: var(--darker); color: var(--text); min-height: 100vh; overflow-x: hidden; }

    .page-loader { position: fixed; inset: 0; background: var(--darker); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; z-index: 9999; }
    .page-loader.hide { display: none; }
    .spinner { width: 42px; height: 42px; border: 3px solid rgba(200,169,110,0.15); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .page { padding: 20px 24px; max-width: 100%; width: 100%; }

    .top-actions { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .top-actions h2 { font-size: 22px; font-weight: 700; color: var(--text); }
    .top-actions h2 span { font-size: 14px; color: var(--subtext); font-weight: 400; margin-left: 8px; }

    .vendor-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .vendor-stat { background: linear-gradient(145deg, var(--card2), var(--card)); border-radius: var(--radius); padding: 18px; text-align: center; border: 1px solid var(--border); box-shadow: var(--shadow); transition: 0.3s; }
    .vendor-stat:hover { transform: translateY(-2px); border-color: rgba(200,169,110,0.2); }
    .vendor-stat h3 { font-size: 28px; font-weight: 700; }
    .vendor-stat p { font-size: 12px; color: var(--subtext); margin-top: 4px; }
    .vendor-stat.gold h3 { color: var(--primary); }
    .vendor-stat.blue h3 { color: var(--info); }
    .vendor-stat.green h3 { color: var(--success); }
    .vendor-stat.orange h3 { color: var(--warning); }

    .filter-bar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
    .filter-bar input { flex: 1; min-width: 200px; padding: 10px 16px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 14px; outline: none; transition: 0.3s; }
    .filter-bar input:focus { border-color: var(--primary); }
    .filter-bar select { padding: 10px 14px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 13px; outline: none; cursor: pointer; }
    .filter-bar select option { background: var(--dark); }

    .vendor-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
    .vendor-card { background: linear-gradient(145deg, var(--card2), var(--card)); border-radius: var(--radius); padding: 18px; border: 1px solid var(--border); box-shadow: var(--shadow); transition: 0.3s; }
    .vendor-card:hover { border-color: rgba(200,169,110,0.25); transform: translateY(-2px); }
    .vendor-card-name { font-size: 16px; font-weight: 700; color: var(--primary); margin-bottom: 4px; }
    .vendor-work-badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; background: rgba(200,169,110,0.12); color: var(--primary); margin-bottom: 12px; }
    .vendor-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); margin-top: 7px; }
    .vendor-row i { color: var(--primary); width: 16px; text-align: center; font-size: 12px; }
    .vendor-row a { color: var(--text); text-decoration: none; }
    .vendor-row a:hover { color: var(--primary); }
    .vendor-actions { display: flex; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); flex-wrap: wrap; }

    .icon-btn { width: 32px; height: 32px; border-radius: 8px; border: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; transition: 0.2s; text-decoration: none; }
    .icon-btn.edit { background: rgba(200,169,110,0.15); color: var(--primary); }
    .icon-btn.delete { background: rgba(244,67,54,0.15); color: var(--danger); }
    .icon-btn.whatsapp { background: rgba(37,211,102,0.15); color: #25d366; }
    .icon-btn.call { background: rgba(33,150,243,0.15); color: var(--info); }
    .icon-btn:hover { transform: scale(1.12); filter: brightness(1.3); }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--subtext); }
    .empty-state i { font-size: 50px; margin-bottom: 15px; display: block; opacity: 0.3; color: var(--primary); }
    .empty-state h3 { font-size: 18px; margin-bottom: 8px; color: var(--text); }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
    .modal-overlay.show { display: flex; }
    .modal { background: linear-gradient(145deg, #1e2d5e, #16213e); border-radius: 20px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; border: 1px solid rgba(200,169,110,0.18); animation: slideUp 0.25s ease; box-shadow: 0 30px 80px rgba(0,0,0,0.6); }
    @keyframes slideUp { from { opacity: 0; transform: translateY(25px); } to { opacity: 1; transform: translateY(0); } }
    .modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: #1e2d5e; z-index: 1; border-radius: 20px 20px 0 0; }
    .modal-header h3 { font-size: 16px; font-weight: 700; color: var(--primary); }
    .modal-close { width: 32px; height: 32px; background: rgba(255,255,255,0.05); border: none; border-radius: 8px; color: var(--text); cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
    .modal-close:hover { background: rgba(244,67,54,0.2); color: var(--danger); }
    .modal-body { padding: 22px 24px; }
    .modal-footer { padding: 14px 24px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }

    .form-group { margin-bottom: 14px; }
    .form-group label { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--subtext); margin-bottom: 8px; display: block; }
    .form-group input, .form-group select {
      width: 100%; padding: 12px 16px;
      background: rgba(255,255,255,0.04);
      border: 1.5px solid rgba(255,255,255,0.08);
      border-radius: 12px; color: var(--text);
      font-size: 14px; outline: none; transition: all 0.25s;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: var(--primary);
      background: rgba(200,169,110,0.06);
      box-shadow: 0 0 0 3px rgba(200,169,110,0.12);
    }
    .form-group select option { background: var(--dark); }

    .btn { padding: 10px 18px; border-radius: 10px; border: none; cursor: pointer; font-size: 13.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
    .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; box-shadow: 0 3px 12px rgba(200,169,110,0.25); padding: 12px 24px; border-radius: 12px; }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-danger { background: rgba(244,67,54,0.1); color: var(--danger); border: 1px solid rgba(244,67,54,0.25); padding: 12px 24px; border-radius: 12px; }
    .btn-danger:hover { background: rgba(244,67,54,0.2); }

    .toast { position: fixed; bottom: 90px; right: 20px; background: var(--success); color: white; padding: 12px 20px; border-radius: 11px; font-size: 13.5px; z-index: 9999; display: none; animation: slideIn 0.3s ease; box-shadow: 0 6px 24px rgba(0,0,0,0.35); font-weight: 500; }
    @keyframes slideIn { from { transform: translateX(100px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    @media (max-width: 768px) {
      .page { padding: 14px; }
      .vendor-grid { grid-template-columns: 1fr; }
      .top-actions { flex-direction: column; align-items: flex-start; }
      .vendor-stats { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<div class="page-loader" id="pageLoader">
  <div class="spinner"></div>
  <p style="color:var(--subtext); font-size:13px; letter-spacing:1px">Loading vendors...</p>
</div>

<div class="toast" id="toast"></div>

<div class="page" id="mainPage" style="display:none">

  <div class="top-actions">
    <h2>🏪 Vendors <span id="vendorCount">0 vendors</span></h2>
    <button class="btn btn-primary" onclick="openAddVendor()">
      <i class="fas fa-plus"></i> Add Vendor
    </button>
  </div>

  <div class="vendor-stats">
    <div class="vendor-stat gold"><h3 id="vs-total">0</h3><p>Total</p></div>
    <div class="vendor-stat blue"><h3 id="vs-civil">0</h3><p>Civil</p></div>
    <div class="vendor-stat green"><h3 id="vs-carpentry">0</h3><p>Carpentry</p></div>
    <div class="vendor-stat orange"><h3 id="vs-electrical">0</h3><p>Electrical</p></div>
  </div>

  <div class="filter-bar">
    <input type="text" id="searchInput" placeholder="🔍 Search by name, phone, work type..." oninput="filterVendors()"/>
    <select id="workFilter" onchange="filterVendors()">
      <option value="">All Work Types</option>
      <option value="Carpentry">Carpentry</option>
      <option value="Electrical">Electrical</option>
      <option value="Plumbing">Plumbing</option>
      <option value="Painting">Painting</option>
      <option value="Tiling">Tiling</option>
      <option value="False Ceiling">False Ceiling</option>
      <option value="POP Work">POP Work</option>
      <option value="Modular Kitchen">Modular Kitchen</option>
      <option value="Aluminium Fabrication">Aluminium Fabrication</option>
      <option value="Glass Work">Glass Work</option>
      <option value="Civil Work">Civil Work</option>
      <option value="Other">Other</option>
    </select>
    <select id="sortFilter" onchange="filterVendors()">
      <option value="name">Name A-Z</option>
      <option value="newest">Newest First</option>
    </select>
  </div>

  <div id="vendorGrid" class="vendor-grid"></div>
  <div id="emptyState" class="empty-state" style="display:none">
    <i class="fas fa-store-slash"></i>
    <h3>No Vendors Found</h3>
    <p>Click Add Vendor to get started</p>
  </div>

</div>

<!-- ADD/EDIT MODAL -->
<div class="modal-overlay" id="vendorModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle"><i class="fas fa-store"></i> Add Vendor</h3>
      <button class="modal-close" onclick="closeModal('vendorModal')"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Vendor Name *</label>
        <input type="text" id="vendorName" placeholder="e.g. Ramesh Carpentry Works"/>
      </div>
      <div class="form-group">
        <label>Phone *</label>
        <input type="tel" id="vendorPhone" placeholder="e.g. 9876543210" maxlength="10" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10)"/>
      </div>
      <div class="form-group">
        <label>Work Type *</label>
        <select id="vendorWorkType">
          <option value="">Select Work Type</option>
          <option value="Carpentry">Carpentry</option>
          <option value="Electrical">Electrical</option>
          <option value="Plumbing">Plumbing</option>
          <option value="Painting">Painting</option>
          <option value="Tiling">Tiling</option>
          <option value="False Ceiling">False Ceiling</option>
          <option value="POP Work">POP Work</option>
          <option value="Modular Kitchen">Modular Kitchen</option>
          <option value="Aluminium Fabrication">Aluminium Fabrication</option>
          <option value="Glass Work">Glass Work</option>
          <option value="Civil Work">Civil Work</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>GST Number (optional)</label>
        <input type="text" id="vendorGst" placeholder="e.g. 36ABCDE1234F1Z5"/>
      </div>
      <div class="form-group">
        <label>PAN Number (optional)</label>
        <input type="text" id="vendorPan" placeholder="e.g. ABCDE1234F"/>
      </div>
      <div class="form-group">
        <label>UPI ID (optional)</label>
        <input type="text" id="vendorUpi" placeholder="e.g. ramesh@upi"/>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger" onclick="closeModal('vendorModal')"><i class="fas fa-times"></i> Cancel</button>
      <button class="btn btn-primary" onclick="saveVendor()"><i class="fas fa-save"></i> Save</button>
    </div>
  </div>
</div>

<!-- DELETE MODAL -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal" style="max-width:400px">
    <div class="modal-header">
      <h3 style="color:var(--danger)">🗑️ Delete Vendor</h3>
      <button class="modal-close" onclick="closeModal('deleteModal')"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body" style="text-align:center; padding:30px 25px">
      <i class="fas fa-exclamation-triangle" style="font-size:50px; color:var(--danger); margin-bottom:15px; display:block"></i>
      <h3 style="margin-bottom:10px">Are you sure?</h3>
      <p style="color:var(--subtext); font-size:14px">This vendor will be permanently deleted.</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger" onclick="closeModal('deleteModal')"><i class="fas fa-times"></i> Cancel</button>
      <button class="btn btn-primary" onclick="confirmDelete()"><i class="fas fa-trash"></i> Delete</button>
    </div>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBLQhUZA-VN4_A9FhQWmlRSQZC2D95KoE8",
    authDomain: "turnkeycrm-ce7b8.firebaseapp.com",
    projectId: "turnkeycrm-ce7b8",
    storageBucket: "turnkeycrm-ce7b8.firebasestorage.app",
    messagingSenderId: "487224108102",
    appId: "1:487224108102:web:dbe9d4ea6abdb2db581647"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();
  const vendorsRef = db.collection('vendors');

  let vendors = [];
  let filteredVendors = [];
  let editingId = null;
  let deletingId = null;
  let currentUserRole = '';

  function showToast(msg, type='success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.background = type === 'danger' ? 'var(--danger)' : type === 'warning' ? 'var(--warning)' : 'var(--success)';
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 3000);
  }

  function openAddVendor() {
    editingId = null;
    document.getElementById('modalTitle').innerHTML = '<i class="fas fa-store"></i> Add Vendor';
    ['vendorName','vendorPhone','vendorGst','vendorPan','vendorUpi'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('vendorWorkType').value = '';
    document.getElementById('vendorModal').classList.add('show');
  }

  function editVendor(id) {
    const v = vendors.find(x => x.id === id);
    if (!v) return;
    editingId = id;
    document.getElementById('modalTitle').innerHTML = '<i class="fas fa-edit"></i> Edit Vendor';
    document.getElementById('vendorName').value = v.name || '';
    document.getElementById('vendorPhone').value = v.phone || '';
    document.getElementById('vendorWorkType').value = v.workType || '';
    document.getElementById('vendorGst').value = v.gst || '';
    document.getElementById('vendorPan').value = v.pan || '';
    document.getElementById('vendorUpi').value = v.upi || '';
    document.getElementById('vendorModal').classList.add('show');
  }

  function closeModal(id) {
    document.getElementById(id).classList.remove('show');
    editingId = null;
    deletingId = null;
  }

  async function saveVendor() {
    const name = document.getElementById('vendorName').value.trim();
    const phone = document.getElementById('vendorPhone').value.trim();
    const workType = document.getElementById('vendorWorkType').value;
    if (!name) { showToast('❌ Enter vendor name', 'danger'); return; }
    if (!phone || phone.length !== 10) { showToast('❌ Enter valid 10-digit phone', 'danger'); return; }
    if (!workType) { showToast('❌ Select work type', 'danger'); return; }
    const data = {
      name, phone, workType,
      gst: document.getElementById('vendorGst').value.trim(),
      pan: document.getElementById('vendorPan').value.trim(),
      upi: document.getElementById('vendorUpi').value.trim(),
      updatedAt: new Date().toISOString()
    };
    try {
      if (editingId) {
        await vendorsRef.doc(editingId).update(data);
        showToast('✅ Vendor updated!');
      } else {
        data.createdAt = new Date().toISOString();
        data.addedBy = auth.currentUser ? auth.currentUser.email : '';
        await vendorsRef.add(data);
        showToast('✅ Vendor added!');
      }
      closeModal('vendorModal');
      await loadVendors();
    } catch (err) {
      showToast('❌ Error: ' + err.message, 'danger');
    }
  }

  function deleteVendor(id) {
    deletingId = id;
    document.getElementById('deleteModal').classList.add('show');
  }

  async function confirmDelete() {
    if (!deletingId) return;
    try {
      await vendorsRef.doc(deletingId).delete();
      showToast('🗑️ Vendor deleted!', 'danger');
      closeModal('deleteModal');
      await loadVendors();
    } catch (err) {
      showToast('❌ Error: ' + err.message, 'danger');
    }
  }

  async function loadVendors() {
    try {
      const snap = await vendorsRef.orderBy('name').get();
      vendors = [];
      snap.forEach(doc => vendors.push({ id: doc.id, ...doc.data() }));
      filteredVendors = [...vendors];
      filterVendors();
      document.getElementById('pageLoader').style.display = 'none';
      document.getElementById('mainPage').style.display = 'block';
    } catch (err) {
      document.getElementById('pageLoader').innerHTML = `
        <div style="text-align:center; color:var(--danger)">
          <i class="fas fa-exclamation-triangle" style="font-size:40px; margin-bottom:15px; display:block"></i>
          <h3>Error Loading Vendors</h3>
          <p style="color:var(--subtext); margin-top:8px">Check connection and retry</p>
          <button onclick="loadVendors()" style="margin-top:15px; padding:10px 20px; background:var(--primary); border:none; border-radius:8px; color:white; cursor:pointer">Retry</button>
        </div>`;
    }
  }

  function filterVendors() {
    const q = document.getElementById('searchInput').value.toLowerCase().trim();
    const wt = document.getElementById('workFilter').value;
    const sort = document.getElementById('sortFilter').value;
    filteredVendors = vendors.filter(v => {
      const matchQ = !q || (v.name||'').toLowerCase().includes(q) || (v.phone||'').includes(q) || (v.workType||'').toLowerCase().includes(q);
      const matchW = !wt || v.workType === wt;
      return matchQ && matchW;
    });
    if (sort === 'newest') {
      filteredVendors.sort((a,b) => new Date(b.createdAt||0) - new Date(a.createdAt||0));
    } else {
      filteredVendors.sort((a,b) => (a.name||'').localeCompare(b.name||''));
    }
    renderVendors();
  }

  function updateStats() {
    document.getElementById('vs-total').textContent = vendors.length;
    document.getElementById('vs-civil').textContent = vendors.filter(v => v.workType === 'Civil Work').length;
    document.getElementById('vs-carpentry').textContent = vendors.filter(v => v.workType === 'Carpentry').length;
    document.getElementById('vs-electrical').textContent = vendors.filter(v => v.workType === 'Electrical').length;
    document.getElementById('vendorCount').textContent = filteredVendors.length + ' vendor' + (filteredVendors.length !== 1 ? 's' : '');
  }

  function renderVendors() {
    updateStats();
    const grid = document.getElementById('vendorGrid');
    const empty = document.getElementById('emptyState');
    const isAdmin = ['admin','superadmin'].includes(currentUserRole);
    if (!filteredVendors.length) {
      grid.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    grid.innerHTML = filteredVendors.map(v => `
      <div class="vendor-card">
        <div class="vendor-card-name">${v.name || '-'}</div>
        <div class="vendor-work-badge"><i class="fas fa-tools"></i> ${v.workType || '-'}</div>
        <div class="vendor-row"><i class="fas fa-phone"></i><a href="tel:${v.phone}">${v.phone || '-'}</a></div>
        ${v.gst ? `<div class="vendor-row"><i class="fas fa-receipt"></i>GST: ${v.gst}</div>` : ''}
        ${v.pan ? `<div class="vendor-row"><i class="fas fa-id-card"></i>PAN: ${v.pan}</div>` : ''}
        ${v.upi ? `<div class="vendor-row"><i class="fas fa-mobile-alt"></i>UPI: ${v.upi}</div>` : ''}
        <div class="vendor-actions">
          ${v.phone ? `<a class="icon-btn whatsapp" href="https://wa.me/91${v.phone}" target="_blank" title="WhatsApp"><i class="fab fa-whatsapp"></i></a>` : ''}
          ${v.phone ? `<a class="icon-btn call" href="tel:${v.phone}" title="Call"><i class="fas fa-phone"></i></a>` : ''}
          <button class="icon-btn edit" onclick="editVendor('${v.id}')" title="Edit"><i class="fas fa-edit"></i></button>
          ${isAdmin ? `<button class="icon-btn delete" onclick="deleteVendor('${v.id}')" title="Delete"><i class="fas fa-trash"></i></button>` : ''}
        </div>
      </div>
    `).join('');
  }

  document.querySelectorAll('.modal-overlay').forEach(o => {
    o.addEventListener('click', function(e) {
      if (e.target === this) closeModal(this.id);
    });
  });

  firebase.auth().onAuthStateChanged(async function(user) {
    if (!user) { window.location.href = 'index.html'; return; }
    try {
      const snap = await db.collection('users').where('email', '==', user.email).limit(1).get();
      if (!snap.empty) currentUserRole = snap.docs[0].data().role || '';
    } catch(e) { currentUserRole = ''; }
    loadVendors();
  });
